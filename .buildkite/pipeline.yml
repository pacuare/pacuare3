# Runs on every push, on every branch (Buildkite's default GitHub trigger
# behavior for a connected pipeline) -- no `branches:` filter here means
# nothing is excluded.
steps:
  - label: ':typescript: Typecheck'
    command:
      - npm ci
      - npm run typecheck
    plugins:
      - docker-compose#v5.13.0:
          run: app
          config: .buildkite/docker-compose.yml

  - label: ':eslint: Lint'
    command:
      - npm ci
      - npm run lint
    plugins:
      - docker-compose#v5.13.0:
          run: app
          config: .buildkite/docker-compose.yml

  - label: ':postgres: Test'
    key: test
    command:
      - npm ci
      - npm run db:migrate
      - npm test
    plugins:
      - docker-compose#v5.13.0:
          run: app
          config: .buildkite/docker-compose.yml

  # Only publishes once the tests above pass; docker buildx build --push
  # itself won't attempt the push if the build stage fails.
  #
  # Publishes both linux/amd64 and linux/arm64/v8. The agent is amd64-only,
  # so the arm64 side is cross-compiled under QEMU emulation (registered via
  # tonistiigi/binfmt); a docker-container buildx builder is required since
  # the default docker driver can't push a multi-platform manifest list.
  - label: ':docker: Build and publish image'
    depends_on:
      - test
    env:
      REGISTRY: packages.buildkite.com/aleks-rutins/pacuare
    command: |
      buildkite-agent oidc request-token \
        --audience "https://$$REGISTRY" \
        --lifetime 300 \
        | docker login "$$REGISTRY" --username buildkite --password-stdin
      branch_tag="$${BUILDKITE_BRANCH//\//-}"
      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --use --name pacuare-multiarch --driver docker-container \
        || docker buildx use pacuare-multiarch
      docker buildx build \
        --platform linux/amd64,linux/arm64/v8 \
        --tag "$$REGISTRY/pacuare3:$$BUILDKITE_COMMIT" \
        --tag "$$REGISTRY/pacuare3:$$branch_tag" \
        --push \
        .

  # Same deal, for the image every user space's container runs (built from
  # ./notebook, not the root Dockerfile). Also tagged `latest` on `main` --
  # that's the tag settings' "Update" button re-pulls by default
  # (`NOTEBOOK_IMAGE`), so a merge to main is what ships a marimo/system
  # update to every space.
  - label: ':docker: Build and publish notebook image'
    depends_on:
      - test
    env:
      REGISTRY: packages.buildkite.com/aleks-rutins/pacuare
    command: |
      buildkite-agent oidc request-token \
        --audience "https://$$REGISTRY" \
        --lifetime 300 \
        | docker login "$$REGISTRY" --username buildkite --password-stdin
      branch_tag="$${BUILDKITE_BRANCH//\//-}"
      docker run --privileged --rm tonistiigi/binfmt --install all
      docker buildx create --use --name pacuare-multiarch --driver docker-container \
        || docker buildx use pacuare-multiarch
      extra_tag=""
      if [ "$$BUILDKITE_BRANCH" = "main" ]; then
        extra_tag="--tag $$REGISTRY/pacuare3-notebook:latest"
      fi
      docker buildx build \
        --platform linux/amd64,linux/arm64/v8 \
        --tag "$$REGISTRY/pacuare3-notebook:$$BUILDKITE_COMMIT" \
        --tag "$$REGISTRY/pacuare3-notebook:$$branch_tag" \
        $$extra_tag \
        --push \
        ./notebook
